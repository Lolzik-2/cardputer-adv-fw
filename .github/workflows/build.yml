name: Build Cardputer ADV Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware for Cardputer ADV
        run: pio run -e m5stack-cardputer-adv

      - name: Merge bootloader, partitions, and firmware into single binary
        run: |
          BUILD_DIR=".pio/build/m5stack-cardputer-adv"
          ESPTOOL="$HOME/.platformio/penv/bin/esptool.py"
          if [ ! -f "$ESPTOOL" ]; then
            ESPTOOL=$(find "$HOME/.platformio" -name "esptool.py" | head -n 1)
          fi

          python "$ESPTOOL" --chip esp32s3 merge_bin \
            -o "$BUILD_DIR/firmware-merged.bin" \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 8MB \
            0x0 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 "$BUILD_DIR/firmware.bin"

      - name: Upload merged firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-adv-merged-firmware
          path: .pio/build/m5stack-cardputer-adv/firmware-merged.bin
          if-no-files-found: error
